# Config for mintlify/multirepo-action (active setup for this site).
# All four repos are public,
# so the default GITHUB_TOKEN can read them.
base: docs.base.json
output: docs.json
sources:
  - repo: mintlify-demo/merge-sort-api
    path: docs
    destination: merge-sort-api
    name: Merge Sort API
  - repo: mintlify-demo/calculator-api
    path: docs
    destination: calculator-api
    name: Calculator API
  - repo: mintlify-demo/todo-api
    path: docs
    destination: todo-api
    name: Todo API
  - repo: mintlify-demo/text-utils-api
    path: docs
    destination: text-utils-api
    name: Text Utils API
